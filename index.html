<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Competición</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --text-color: #f0f0f0;
            --accent-color: #007acc;
            --row-bg: #2d2d2d;
            --row-alt: #252525;
            --ok-color: #4CAF50;
            --error-color: #F44336;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        th {
            background-color: var(--accent-color);
            color: white;
            position: sticky;
            top: 0;
            cursor: pointer;
            user-select: none;
        }

        th:hover { 
            background-color: #005f9e; 
        }

        .sort-icon { 
            font-size: 0.8em; 
            margin-left: 5px; 
            opacity: 0.8;
        }

        tr:nth-child(even) { background-color: var(--row-alt); }
        tr:nth-child(odd) { background-color: var(--row-bg); }

        .btn-refresh {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-refresh:hover { background-color: #005f9e; }
        
        .btn-visto {
            background-color: transparent;
            border: 1px solid #888;
            color: #888;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-visto.visto {
            background-color: var(--ok-color);
            color: white;
            border-color: var(--ok-color);
        }

        a {
            color: #61afef;
            text-decoration: none;
        }
        
        a:hover { text-decoration: underline; }

        .status-ok { color: var(--ok-color); font-weight: bold; }
        .status-error { color: var(--error-color); font-weight: bold; }
        
        #loader {
            display: none;
            font-style: italic;
            color: #aaa;
        }
        
        #error-msg {
            display: none;
            color: var(--error-color);
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>Panel de Tatamis</h1>
            <p>Última actualización: <span id="last-update">Nunca</span> <span id="loader">(Buscando datos...)</span></p>
            <p id="error-msg">Aviso: Ha habido un error leyendo alguna categoría.</p>
        </div>
        <button class="btn-refresh" onclick="actualizarDatos()">Refrescar Ahora</button>
    </div>

    <table id="data-table">
        <thead>
            <tr>
                <th onclick="sortTable(0)">Visto <span class="sort-icon"></span></th>
                <th onclick="sortTable(1)">Hora <span class="sort-icon"></span></th>
                <th onclick="sortTable(2)">Tatami <span class="sort-icon"></span></th>
                <th onclick="sortTable(3)">Categoría <span class="sort-icon"></span></th>
                <th onclick="sortTable(4)">Estado <span class="sort-icon"></span></th>
                <th onclick="sortTable(5)">Pendientes <span class="sort-icon"></span></th>
                <th>Enlace</th>
            </tr>
        </thead>
        <tbody>
            <!-- Los datos se insertarán aquí con JS -->
        </tbody>
    </table>

    <script>
        const BASE_URL = "https://cloud.karatescoring.com/tournaments/FGK2026_LigaJ3/";
        // VOLVEMOS AL PROXY JSON QUE SÍ TE FUNCIONABA
        const PROXY_URL = "https://api.allorigins.win/get?url="; 
        
        let tatamiDict = {};
        let vistos = JSON.parse(localStorage.getItem('combates_vistos') || '{}');
        let sortCol = -1;
        let sortAsc = true;
        let isFetching = false;

        // Función para dar un respiro al proxy y que no nos bloquee (300 milisegundos)
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function fetchHTML(url) {
            const separador = url.includes('?') ? '&' : '?';
            const finalUrl = `${url}${separador}t=${Date.now()}`;
            
            const response = await fetch(PROXY_URL + encodeURIComponent(finalUrl));
            if (!response.ok) throw new Error('Error en la red');
            
            const data = await response.json();
            const parser = new DOMParser();
            return parser.parseFromString(data.contents, "text/html");
        }

        async function obtenerTatamis() {
            try {
                const doc = await fetchHTML(BASE_URL + "index.php?accion=tatamis");
                let dic = {};
                const h4s = doc.querySelectorAll("h4");
                
                h4s.forEach(h4 => {
                    const tatamiNombre = h4.textContent.trim();
                    let divHermano = h4.nextElementSibling;
                    while (divHermano && divHermano.tagName.toLowerCase() !== 'div') {
                        divHermano = divHermano.nextElementSibling;
                    }
                    
                    if (!divHermano) return;
                    
                    const tabla = divHermano.querySelector("table");
                    if (!tabla) return;
                    
                    const filas = tabla.querySelectorAll("tr");
                    filas.forEach(fila => {
                        const celdas = fila.querySelectorAll("td");
                        if (celdas.length >= 2) {
                            const nombreCat = celdas[1].textContent.replace(/\s+/g, ' ').trim().toUpperCase();
                            dic[nombreCat] = tatamiNombre;
                        }
                    });
                });
                return dic;
            } catch (error) {
                console.error("Error obteniendo tatamis:", error);
                return tatamiDict;
            }
        }

        async function obtenerEnlacesIniciados() {
            try {
                const doc = await fetchHTML(BASE_URL + "index.php?accion=sorteos");
                let enlaces = [];
                const filas = doc.querySelectorAll("tr");

                for (let row of filas) {
                    const tds = row.querySelectorAll("td");
                    if (tds.length >= 3 && tds[1].querySelector(".fondoNaranja")) {
                        const button = tds[2].querySelector("button[onclick]");
                        if (button) {
                            const match = button.getAttribute("onclick").match(/darValor\('idCompeticion',\s*(\d+)\)/);
                            if (match) {
                                const idComp = match[1];
                                const urlBase = `${BASE_URL}index.php?accion=verHojaCompeticion&idCompeticion=${idComp}`;
                                
                                // EXTRACCIÓN DE LA HORA (CELDA POR CELDA)
                                let horaInicio = "-";
                                for (let td of tds) {
                                    // Busca "YYYY-MM-DD HH:MM", da igual los espacios que haya
                                    const dateMatch = td.textContent.trim().match(/\d{4}-\d{2}-\d{2}\s+(\d{2}:\d{2})/);
                                    if (dateMatch) {
                                        horaInicio = dateMatch[1]; // Nos quedamos solo con la hora
                                        break;
                                    }
                                }

                                try {
                                    await sleep(300); // Pausa para no saturar al proxy
                                    const docComp = await fetchHTML(urlBase);
                                    const poolElements = docComp.querySelectorAll(".rotuloGrupo");
                                    let numPools = 0;
                                    
                                    if (poolElements.length > 0) {
                                        const textoPool = poolElements[0].textContent.trim();
                                        const matchPool = textoPool.match(/\/\s*(\d+)/);
                                        if (matchPool) {
                                            numPools = parseInt(matchPool[1]);
                                        }
                                    }

                                    if (numPools > 1) {
                                        for (let idx = 1; idx <= numPools; idx++) {
                                            enlaces.push({
                                                url: `${urlBase}&verPool=${idx}&poolMostrada=1`,
                                                hora: horaInicio
                                            });
                                        }
                                    } else {
                                        enlaces.push({ url: urlBase, hora: horaInicio });
                                    }
                                } catch (e) {
                                    console.error("Error revisando pools en:", urlBase);
                                    enlaces.push({ url: urlBase, hora: horaInicio });
                                }
                            }
                        }
                    }
                }
                return enlaces;
            } catch (error) {
                console.error("Error obteniendo enlaces principales:", error);
                throw error; 
            }
        }

        async function verificarPuntuacionesYTitulo(url) {
            try {
                await sleep(300); // Pausa antes de comprobar la puntuación
                const doc = await fetchHTML(url);
                const tituloElement = doc.querySelector("h3");
                let titulo = tituloElement ? tituloElement.textContent.replace(/\s+/g, ' ').trim() : "Desconocido";

                const liguillas = Array.from(doc.querySelectorAll(".cajaEncuentroLiguilla"));
                const eliminatorias = Array.from(doc.querySelectorAll(".cajaEncuentroEliminatorias"));
                const combates = [...liguillas, ...eliminatorias];

                let combatesRestantes = 0;
                combates.forEach(combate => {
                    const puntos = Array.from(combate.querySelectorAll(".cajaPuntos"));
                    const tienePuntos = puntos.some(p => p.textContent.trim() !== "");
                    if (!tienePuntos) {
                        combatesRestantes++;
                    }
                });

                let todosValidos = false;

                if (liguillas.length > 0) {
                    titulo += " (Liguilla)";
                    return { titulo, estado: null, pendientes: combatesRestantes };
                }

                const poolContainer = doc.querySelector(".cajaPoolEliminatorias");
                if (poolContainer) {
                    const rondas = Array.from(poolContainer.querySelectorAll(".cajaRondaEliminatorias"));
                    
                    if (rondas.length > 0) {
                        const combatesCol1 = rondas[0].querySelectorAll(".cajaEncuentroEliminatorias");
                        combatesCol1.forEach(combate => {
                            const competidores = combate.querySelectorAll(".textoBlancoNombreCompetidor");
                            if (competidores.length === 1) {
                                const puntos = Array.from(combate.querySelectorAll(".cajaPuntos"));
                                if (!puntos.some(p => p.textContent.trim() !== "")) {
                                    combatesRestantes--;
                                }
                            }
                        });
                    }

                    if (rondas.length >= 2) {
                        let penultima = rondas[rondas.length - 2];
                        
                        const matchPoolId = url.match(/verPool=(\d+)/);
                        if (matchPoolId) {
                            titulo += ` (Pool ${matchPoolId[1]})`;
                            penultima = rondas[rondas.length - 1]; 
                        }

                        if(penultima) {
                            const puntos = Array.from(penultima.querySelectorAll(".cajaPuntos"));
                            todosValidos = puntos.length > 0 && puntos.every(p => p.textContent.trim() !== "");
                        }
                    }
                }

                return { titulo, estado: todosValidos, pendientes: Math.max(0, combatesRestantes) };

            } catch (error) {
                return { titulo: "Error de carga", estado: false, pendientes: 0 };
            }
        }

        function buscarTatamiParaCategoria(tituloCompleto) {
            if (tituloCompleto === "Error de carga") return "Desconocido";

            const tituloMayus = tituloCompleto.toUpperCase();
            if (tatamiDict[tituloMayus]) return tatamiDict[tituloMayus];

            let nombreBase = tituloCompleto;
            if (tituloCompleto.includes(' (')) {
                nombreBase = tituloCompleto.split(' (')[0].trim();
            }
            const nombreBaseMayus = nombreBase.toUpperCase();
            
            const matchPool = tituloCompleto.match(/POOL\s*(\d+)/i);
            const poolNum = matchPool ? matchPool[1] : null;

            let posiblesClaves = Object.keys(tatamiDict).filter(key => 
                key.includes(nombreBaseMayus) || nombreBaseMayus.includes(key)
            );

            if (posiblesClaves.length === 0) {
                const palabras = nombreBaseMayus.split(/[\s-]+/).filter(p => p.length > 3);
                posiblesClaves = Object.keys(tatamiDict).filter(key => {
                    let matches = palabras.filter(p => key.includes(p)).length;
                    return palabras.length > 0 && (matches / palabras.length) >= 0.7;
                });
            }

            if (posiblesClaves.length > 0) {
                if (poolNum) {
                    const regexPool = new RegExp(`\\b(?:POOL|P|G|GRUPO)\\s*-?\\s*0*${poolNum}\\b|\\b0*${poolNum}\\s*/|\\(0*${poolNum}\\)`, 'i');
                    for (let key of posiblesClaves) {
                        if (regexPool.test(key)) return tatamiDict[key];
                    }
                    const regexNumFinal = new RegExp(`\\b0*${poolNum}$`);
                    for (let key of posiblesClaves) {
                        if (regexNumFinal.test(key.trim())) return tatamiDict[key];
                    }
                } else {
                    const regexCualquierPool = /\b(?:POOL|P|G)\s*\d+\b|\b\d+\s*\/\s*\d+\b|\(\d+\)/i;
                    for (let key of posiblesClaves) {
                        if (!regexCualquierPool.test(key)) return tatamiDict[key];
                    }
                }
                
                return tatamiDict[posiblesClaves[0]];
            }

            return "Desconocido";
        }

        function toggleVisto(url, btnElement) {
            vistos[url] = !vistos[url];
            localStorage.setItem('combates_vistos', JSON.stringify(vistos));
            
            if (vistos[url]) {
                btnElement.classList.add('visto');
                btnElement.textContent = "✔ Visto";
            } else {
                btnElement.classList.remove('visto');
                btnElement.textContent = "Marcar";
            }
        }

        function sortTable(columnIndex) {
            const table = document.getElementById("data-table");
            const tbody = table.querySelector("tbody");
            const rows = Array.from(tbody.querySelectorAll("tr"));

            if (sortCol === columnIndex) {
                sortAsc = !sortAsc;
            } else {
                sortAsc = true;
                sortCol = columnIndex;
            }

            const ths = table.querySelectorAll("th");
            ths.forEach(th => {
                const icon = th.querySelector('.sort-icon');
                if(icon) icon.textContent = '';
            });
            ths[columnIndex].querySelector('.sort-icon').textContent = sortAsc ? ' ▲' : ' ▼';

            rows.sort((a, b) => {
                let valA = a.cells[columnIndex].textContent.trim();
                let valB = b.cells[columnIndex].textContent.trim();

                if (columnIndex === 0) { 
                    valA = a.cells[0].querySelector('button').classList.contains('visto') ? 1 : 0;
                    valB = b.cells[0].querySelector('button').classList.contains('visto') ? 1 : 0;
                    return sortAsc ? valA - valB : valB - valA;
                } else if (columnIndex === 5) { 
                    valA = parseInt(valA) || 0;
                    valB = parseInt(valB) || 0;
                    return sortAsc ? valA - valB : valB - valA;
                } else { 
                    const cmp = valA.localeCompare(valB, undefined, { numeric: true, sensitivity: 'base' });
                    return sortAsc ? cmp : -cmp;
                }
            });

            rows.forEach(row => tbody.appendChild(row));
        }

        async function actualizarDatos() {
            if (isFetching) return;
            isFetching = true;
            
            document.getElementById('loader').style.display = 'inline';
            document.getElementById('error-msg').style.display = 'none';
            let hubErrores = false;

            try {
                if (Object.keys(tatamiDict).length === 0) {
                    tatamiDict = await obtenerTatamis();
                }

                const enlacesItems = await obtenerEnlacesIniciados();
                const fragment = document.createDocumentFragment();

                for (let item of enlacesItems) {
                    const url = item.url;
                    const horaInicio = item.hora;
                    
                    const { titulo, estado, pendientes } = await verificarPuntuacionesYTitulo(url);
                    if (titulo === "Error de carga") hubErrores = true;
                    
                    const tatami = buscarTatamiParaCategoria(titulo);
                    
                    const tr = document.createElement("tr");

                    const tdVisto = document.createElement("td");
                    const isVisto = vistos[url] || false;
                    tdVisto.innerHTML = `<button class="btn-visto ${isVisto ? 'visto' : ''}" onclick="toggleVisto('${url}', this)">${isVisto ? '✔ Visto' : 'Marcar'}</button>`;
                    
                    const tdHora = document.createElement("td");
                    tdHora.textContent = horaInicio;

                    const tdTatami = document.createElement("td");
                    tdTatami.textContent = tatami;

                    const tdCat = document.createElement("td");
                    tdCat.textContent = titulo;

                    const tdEstado = document.createElement("td");
                    if (estado === null) {
                        tdEstado.textContent = "-";
                    } else {
                        tdEstado.innerHTML = estado ? '<span class="status-ok">OK</span>' : '<span class="status-error">X</span>';
                    }

                    const tdPendientes = document.createElement("td");
                    tdPendientes.textContent = pendientes;

                    const tdEnlace = document.createElement("td");
                    tdEnlace.innerHTML = `<a href="${url}" target="_blank">Abrir ↗</a>`;

                    tr.append(tdVisto, tdHora, tdTatami, tdCat, tdEstado, tdPendientes, tdEnlace);
                    fragment.appendChild(tr);
                }

                const tbody = document.querySelector("#data-table tbody");
                tbody.innerHTML = "";
                tbody.appendChild(fragment);

                const now = new Date();
                document.getElementById('last-update').textContent = now.toLocaleTimeString();
                
                if (hubErrores) {
                    document.getElementById('error-msg').style.display = 'block';
                }
                
                if (sortCol !== -1) {
                    sortAsc = !sortAsc; 
                    sortTable(sortCol);
                }

            } catch (error) {
                console.error("Error crítico durante la actualización:", error);
                document.getElementById('error-msg').style.display = 'block';
            } finally {
                document.getElementById('loader').style.display = 'none';
                isFetching = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            actualizarDatos();
            // Lo bajamos a refrescar cada 2 minutos para no agotar el proxy gratis tan rápido
            setInterval(actualizarDatos, 120000); 
        });
    </script>
</body>
</html>
